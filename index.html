<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Flipped Media Player</title>

<style>

*{box-sizing:border-box;}

body{
margin:40px;
font-family:Arial, Helvetica, sans-serif;
background:white;
color:black;
}

a.home-link{
position:fixed;
bottom:1rem;
left:1rem;
font-size:11px;
text-decoration:none;
color:black;
z-index:20;
}

a.home-link:hover{
text-decoration:underline;
}

/* START SCREEN */

.start-screen{
position:fixed;
top:40px;
left:40px;
right:40px;
bottom:40px;
display:flex;
align-items:center;
justify-content:center;
}

.start-screen.hidden{
display:none;
}

.choose-btn-wrap label{
padding:14px 28px;
background:#e6e6e6;
color:black;
cursor:pointer;
font-size:14px;
}

.choose-btn-wrap label:hover{
background:#d8d8d8;
}

.choose-btn-wrap input{
display:none;
}

/* VIDEO */

.video-container{
position:fixed;
top:40px;
left:40px;
right:40px;
bottom:40px;
background:black;
display:flex;
align-items:center;
justify-content:center;
}

.video-container.hidden{
display:none;
}

video{
width:100%;
height:100%;
object-fit:contain;
transform:scaleX(-1);
}

/* CONTROLS */

.controls{
position:absolute;
bottom:0;
left:0;
right:0;

height:48px;

background:white;
border-top:1px solid #ddd;

display:flex;
align-items:center;
gap:10px;

padding:0 10px;

opacity:0;
pointer-events:none;
transition:opacity .3s;
}

.controls.visible{
opacity:1;
pointer-events:auto;
}

button{
border:none;
background:none;
cursor:pointer;
font-size:14px;
}

.progress-wrap{
flex:1;
height:6px;
background:#ddd;
cursor:pointer;
}

.progress-fill{
height:100%;
background:black;
width:0%;
}

.time{
font-size:12px;
min-width:80px;
text-align:right;
}

.vol-wrap{
display:flex;
align-items:center;
gap:4px;
}

.vol-wrap input{
width:70px;
}

.change-file{
font-size:12px;
cursor:pointer;
}

.change-file input{
display:none;
}

/* MOBILE */

@media (max-width:700px){

body{
margin:10px;
}

.video-container{
top:10px;
left:10px;
right:10px;
bottom:10px;
}

.controls{
height:54px;
font-size:14px;
}

.progress-wrap{
height:8px;
}

.vol-wrap input{
width:50px;
}

}

</style>
</head>

<body>

<a class="home-link" href="https://giuseppedicanio.github.io">
Giuseppe Dicanio
</a>

<div class="start-screen" id="startScreen">

<div class="choose-btn-wrap">

<label for="fileInput">Choose file</label>
<input id="fileInput" type="file" accept="video/*">

</div>

</div>

<div class="video-container hidden" id="videoContainer">

<video id="video" playsinline></video>

<div class="controls" id="controls">

<button id="playBtn">▶</button>

<div class="progress-wrap" id="progressWrap">
<div class="progress-fill" id="progressFill"></div>
</div>

<div class="time" id="time">0:00 / 0:00</div>

<div class="vol-wrap">

<button id="muteBtn">🔊</button>

<input id="volume" type="range" min="0" max="1" step="0.05" value="1">

</div>

<label class="change-file">

file

<input type="file" accept="video/*" id="fileInput2">

</label>

<button id="fullscreenBtn">⛶</button>

</div>

</div>

<script>

const video=document.getElementById("video")
const startScreen=document.getElementById("startScreen")
const container=document.getElementById("videoContainer")

const controls=document.getElementById("controls")

const playBtn=document.getElementById("playBtn")

const progressWrap=document.getElementById("progressWrap")
const progressFill=document.getElementById("progressFill")

const timeEl=document.getElementById("time")

const volume=document.getElementById("volume")
const muteBtn=document.getElementById("muteBtn")

const fullscreenBtn=document.getElementById("fullscreenBtn")

let hideTimer

/* LOAD VIDEO */

function loadFile(file){

if(!file)return

video.src=URL.createObjectURL(file)

startScreen.classList.add("hidden")
container.classList.remove("hidden")

video.play()

showControls()

}

fileInput.onchange=function(){loadFile(this.files[0])}
fileInput2.onchange=function(){loadFile(this.files[0])}

/* TIME */

function formatTime(s){

let m=Math.floor(s/60)
let sec=Math.floor(s%60)

return m+":"+(sec<10?"0":"")+sec

}

function updateUI(){

let p=video.currentTime/(video.duration||1)

progressFill.style.width=(p*100)+"%"

timeEl.textContent=
formatTime(video.currentTime)+" / "+formatTime(video.duration||0)

}

video.ontimeupdate=updateUI
video.onloadedmetadata=updateUI

/* PLAY BUTTON */

playBtn.onclick=togglePlay

function togglePlay(){

if(video.paused)video.play()
else video.pause()

}

/* CLICK VIDEO */

video.addEventListener("click",togglePlay)

/* KEYBOARD */

document.addEventListener("keydown",e=>{

if(e.code==="Space"){

e.preventDefault()
togglePlay()

}

if(e.code==="ArrowRight")video.currentTime+=5

if(e.code==="ArrowLeft")video.currentTime-=5

})

/* SEEK */

progressWrap.onclick=e=>{

const rect=progressWrap.getBoundingClientRect()

const pos=(e.clientX-rect.left)/rect.width

video.currentTime=pos*video.duration

}

/* VOLUME */

volume.oninput=function(){

video.volume=this.value

}

/* MUTE */

muteBtn.onclick=function(){

if(video.volume>0){

video.dataset.prev=video.volume
video.volume=0
volume.value=0

}else{

video.volume=video.dataset.prev||1
volume.value=video.volume

}

}

/* FULLSCREEN */

fullscreenBtn.onclick=function(){

if(!document.fullscreenElement)
container.requestFullscreen()
else
document.exitFullscreen()

}

/* CONTROLS AUTO HIDE */

function showControls(){

controls.classList.add("visible")

clearTimeout(hideTimer)

hideTimer=setTimeout(()=>{

if(!video.paused)
controls.classList.remove("visible")

},2000)

}

container.addEventListener("mousemove",showControls)
container.addEventListener("touchstart",showControls)

video.addEventListener("pause",()=>{

controls.classList.add("visible")

})

video.addEventListener("play",showControls)

</script>

</body>
</html>
