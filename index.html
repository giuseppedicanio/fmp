<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flipped Media Player</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000;
      overflow: hidden;
    }

    body.fullscreen-mode {
      width: 100vw;
      height: 100vh;
    }

    .container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .video-section {
      flex: 1;
      width: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .video-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      position: relative;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform: scaleX(-1);
      background: #000;
      display: block;
      cursor: pointer;
    }

    .welcome-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      z-index: 100;
    }

    .welcome-content {
      text-align: center;
    }

    .welcome-content h1 {
      font-size: 48px;
      margin-bottom: 20px;
      font-weight: 700;
    }

    .welcome-content p {
      font-size: 18px;
      margin-bottom: 30px;
      opacity: 0.8;
    }

    .file-input-wrapper {
      position: relative;
      display: inline-block;
    }

    #file-input {
      display: none;
    }

    .file-input-label {
      display: inline-block;
      padding: 14px 40px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 16px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .file-input-label:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.6);
    }

    .controls-bar {
      width: 100%;
      background: rgba(0, 0, 0, 0.9);
      padding: 15px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 50;
    }

    .controls-bar.hidden {
      display: none;
    }

    .seek-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .time-display {
      color: white;
      font-family: 'Monaco', 'Courier New', monospace;
      font-size: 13px;
      font-weight: 600;
      min-width: 100px;
      text-align: center;
      flex-shrink: 0;
    }

    input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      background: #444;
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      cursor: pointer;
      box-shadow: 0 0 8px rgba(102, 126, 234, 0.6);
    }

    input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      cursor: pointer;
      border: none;
      box-shadow: 0 0 8px rgba(102, 126, 234, 0.6);
    }

    input[type="range"]::-moz-range-track {
      background: transparent;
      border: none;
    }

    input[type="range"]::-moz-range-progress {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 6px;
      border-radius: 3px;
    }

    .buttons-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.2s;
      flex-shrink: 0;
      white-space: nowrap;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.6);
    }

    button:active {
      transform: translateY(0);
    }

    button.secondary {
      background: rgba(255, 255, 255, 0.2);
    }

    button.secondary:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .volume-control {
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 150px;
    }

    .volume-icon {
      color: white;
      font-size: 14px;
      flex-shrink: 0;
    }

    .volume-slider {
      width: 100px !important;
    }

    @media (max-width: 768px) {
      .welcome-content h1 {
        font-size: 32px;
      }

      .welcome-content p {
        font-size: 16px;
      }

      .controls-bar {
        padding: 12px 15px;
        gap: 10px;
      }

      .time-display {
        font-size: 12px;
        min-width: 85px;
      }

      button {
        padding: 7px 12px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="video-section">
      <div class="video-wrapper">
        <video id="video" playsinline></video>
        <div class="welcome-overlay" id="welcome-overlay">
          <div class="welcome-content">
            <h1>🎬 Flipped Media Player</h1>
            <p>Guarda i tuoi video specchiati</p>
            <div class="file-input-wrapper">
              <input type="file" id="file-input" accept="video/*" />
              <label for="file-input" class="file-input-label">📁 Scegli un video</label>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="controls-bar hidden" id="controls-bar">
      <div class="seek-row">
        <button id="play-pause">▶ Play</button>
        <div class="time-display" id="time-display">0:00 / 0:00</div>
        <input type="range" id="seek-bar" min="0" max="100" value="0" />
      </div>

      <div class="buttons-row">
        <div class="volume-control">
          <span class="volume-icon">🔊</span>
          <input type="range" id="volume" class="volume-slider" min="0" max="1" step="0.01" value="1" />
        </div>
        <button class="secondary" id="fullscreen-btn">⛶ Fullscreen</button>
        <button class="secondary" id="reset-btn">🔄 Reset</button>
      </div>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('file-input');
    const video = document.getElementById('video');
    const playPauseBtn = document.getElementById('play-pause');
    const timeDisplay = document.getElementById('time-display');
    const seekBar = document.getElementById('seek-bar');
    const volumeSlider = document.getElementById('volume');
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    const resetBtn = document.getElementById('reset-btn');
    const controlsBar = document.getElementById('controls-bar');
    const welcomeOverlay = document.getElementById('welcome-overlay');
    const container = document.querySelector('.container');

    let videoURL = null;
    let seekingByUser = false;
    let controlsTimeout = null;

    function formatTime(seconds) {
      if (isNaN(seconds) || !isFinite(seconds)) return '0:00';
      const minutes = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${minutes}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function updateTimeDisplay() {
      const current = video.currentTime || 0;
      const duration = video.duration || 0;
      timeDisplay.textContent = `${formatTime(current)} / ${formatTime(duration)}`;
    }

    function togglePlayPause() {
      if (!video.src) return;
      if (video.paused) {
        video.play();
      } else {
        video.pause();
      }
    }

    function showControls() {
      controlsBar.classList.remove('hidden');
      clearTimeout(controlsTimeout);
      
      controlsTimeout = setTimeout(() => {
        if (!video.paused) {
          controlsBar.classList.add('hidden');
        }
      }, 3000);
    }

    function requestFullscreen() {
      const elem = container;
      if (elem.requestFullscreen) {
        elem.requestFullscreen();
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      } else if (elem.msRequestFullscreen) {
        elem.msRequestFullscreen();
      }
    }

    function resetSettings() {
      seekBar.value = 0;
      volumeSlider.value = 1;
      video.volume = 1;
      video.currentTime = 0;
      updateTimeDisplay();
    }

    // File input
    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (!file) return;

      if (videoURL) {
        URL.revokeObjectURL(videoURL);
      }

      videoURL = URL.createObjectURL(file);
      video.src = videoURL;
      video.load();

      welcomeOverlay.style.display = 'none';
      controlsBar.classList.remove('hidden');
      resetSettings();
      playPauseBtn.textContent = '▶ Play';
    });

    // Video events
    video.addEventListener('loadedmetadata', () => {
      updateTimeDisplay();
    });

    video.addEventListener('timeupdate', () => {
      if (!seekingByUser) {
        const percent = (video.currentTime / video.duration) * 100;
        seekBar.value = percent;
        updateTimeDisplay();
      }
    });

    video.addEventListener('play', () => {
      playPauseBtn.textContent = '⏸ Pause';
      showControls();
    });

    video.addEventListener('pause', () => {
      playPauseBtn.textContent = '▶ Play';
      controlsBar.classList.remove('hidden');
    });

    video.addEventListener('mousemove', showControls);
    video.addEventListener('click', togglePlayPause);

    // Controls
    playPauseBtn.addEventListener('click', togglePlayPause);

    seekBar.addEventListener('input', () => {
      seekingByUser = true;
      const duration = video.duration || 0;
      if (duration > 0) {
        video.currentTime = (seekBar.value / 100) * duration;
      }
      updateTimeDisplay();
    });

    seekBar.addEventListener('change', () => {
      seekingByUser = false;
    });

    volumeSlider.addEventListener('input', () => {
      video.volume = volumeSlider.value;
    });

    fullscreenBtn.addEventListener('click', requestFullscreen);
    resetBtn.addEventListener('click', resetSettings);

    // Keyboard shortcuts
    document.addEventListener('keydown', (event) => {
      if (!video.src) return;

      const active = document.activeElement;
      const isInput = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA');

      if (isInput) return;

      switch (event.code) {
        case 'Space':
          event.preventDefault();
          togglePlayPause();
          break;
        case 'KeyF':
          event.preventDefault();
          requestFullscreen();
          break;
        case 'ArrowRight':
          event.preventDefault();
          video.currentTime = Math.min(video.currentTime + 5, video.duration);
          showControls();
          updateTimeDisplay();
          break;
        case 'ArrowLeft':
          event.preventDefault();
          video.currentTime = Math.max(video.currentTime - 5, 0);
          showControls();
          updateTimeDisplay();
          break;
        case 'Escape':
          if (document.fullscreenElement) {
            document.exitFullscreen();
          }
          break;
      }
    });

    updateTimeDisplay();
  </script>
</body>
</html>
