<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title></title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --accent: #111;
      --accent-light: #777;
      --border: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "Segoe UI", sans-serif;
      background: #ffffff;
      color: #000000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .shell {
      width: 100%;
      max-width: 880px;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      background: #ffffff;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.06);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Pulsante upload rotondo in alto */
    .top-row {
      display: flex;
      justify-content: flex-start;
      align-items: center;
    }

    .upload-btn {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #fafafa;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, border-color 0.15s ease,
        transform 0.08s ease;
      position: relative;
    }

    .upload-btn:hover {
      background: #f0f0f0;
      border-color: #d0d0d0;
    }

    .upload-btn:active {
      transform: translateY(1px);
    }

    .upload-btn::before,
    .upload-btn::after {
      content: "";
      position: absolute;
      background: var(--accent);
      border-radius: 999px;
    }

    .upload-btn::before {
      width: 12px;
      height: 2px;
    }

    .upload-btn::after {
      width: 2px;
      height: 12px;
    }

    #fileInput {
      display: none;
    }

    .player-shell {
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #fdfdfd;
      padding: 10px 10px 12px;
      display: none;
      flex-direction: column;
      gap: 8px;
    }

    .video-frame {
      position: relative;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .video-mirror-wrapper {
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
      transform-origin: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 4px;
      font-size: 12px;
      user-select: none;
    }

    .controls-left,
    .controls-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .controls-main {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Pulsante play/pause rotondo */
    .ctrl-circle {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, border-color 0.15s ease,
        transform 0.08s ease;
      position: relative;
    }

    .ctrl-circle:hover {
      background: #f4f4f4;
      border-color: #d0d0d0;
    }

    .ctrl-circle:active {
      transform: translateY(1px);
    }

    /* Icona play (triangolo) di default */
    #playPauseBtn::before {
      content: "";
      border-style: solid;
      border-width: 6px 0 6px 10px;
      border-color: transparent transparent transparent var(--accent);
      margin-left: 2px;
    }

    /* Icona pausa (due barre) quando in riproduzione */
    #playPauseBtn.is-playing::before,
    #playPauseBtn.is-playing::after {
      content: "";
      width: 3px;
      height: 12px;
      background: var(--accent);
      border-radius: 999px;
    }

    #playPauseBtn.is-playing::before {
      margin-right: 2px;
    }

    #playPauseBtn.is-playing::after {
      margin-left: 2px;
    }

    /* Slider progresso */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 999px;
      background: #e6e6e6;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #111;
      cursor: pointer;
      margin-top: -5px;
    }

    input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #111;
      cursor: pointer;
      border: none;
    }

    input[type="range"]::-moz-range-track {
      background: #e6e6e6;
      height: 4px;
      border-radius: 999px;
    }

    /* Volume slider un po' più corto */
    #volume {
      max-width: 80px;
    }

    /* Pulsante full screen: quadrato vuoto */
    #fsBtn {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #ffffff;
      cursor: pointer;
      position: relative;
      transition: background 0.15s ease, border-color 0.15s ease,
        transform 0.08s ease;
    }

    #fsBtn::before {
      content: "";
      position: absolute;
      inset: 4px;
      border: 1px solid var(--accent);
      border-radius: 3px;
    }

    #fsBtn:hover {
      background: #f4f4f4;
      border-color: #d0d0d0;
    }

    #fsBtn:active {
      transform: translateY(1px);
    }

    @media (max-width: 600px) {
      .shell {
        padding: 18px;
      }
      .controls {
        flex-direction: column;
        align-items: stretch;
      }
      .controls-main {
        width: 100%;
      }
      .controls-left,
      .controls-right {
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="top-row">
      <button id="uploadBtn" type="button" class="upload-btn"></button>
      <input id="fileInput" type="file" accept="video/*" />
    </div>

    <section id="playerShell" class="player-shell">
      <div class="video-container" id="videoContainer">
        <div class="video-frame">
          <div class="video-mirror-wrapper">
            <video id="video" preload="metadata"></video>
          </div>
        </div>

        <div class="controls">
          <div class="controls-left">
            <button id="playPauseBtn" type="button" class="ctrl-circle"></button>
          </div>

          <div class="controls-main">
            <input id="seekBar" type="range" min="0" max="100" value="0" />
          </div>

          <div class="controls-right">
            <input
              id="volume"
              type="range"
              min="0"
              max="1"
              step="0.01"
              value="1"
            />
            <button id="fsBtn" type="button"></button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const fileInput = document.getElementById("fileInput");
    const uploadBtn = document.getElementById("uploadBtn");
    const playerShell = document.getElementById("playerShell");
    const video = document.getElementById("video");
    const playPauseBtn = document.getElementById("playPauseBtn");
    const seekBar = document.getElementById("seekBar");
    const volume = document.getElementById("volume");
    const fsBtn = document.getElementById("fsBtn");
    const videoContainer = document.getElementById("videoContainer");

    let objectUrl = null;
    let isSeeking = false;

    function formatTime(seconds) {
      if (!isFinite(seconds)) return 0;
      return seconds;
    }

    uploadBtn.addEventListener("click", () => {
      fileInput.click();
    });

    fileInput.addEventListener("change", () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;

      if (objectUrl) {
        URL.revokeObjectURL(objectUrl);
      }
      objectUrl = URL.createObjectURL(file);
      video.src = objectUrl;
      video.currentTime = 0;
      seekBar.value = 0;
      playerShell.style.display = "flex";
      video.load();
    });

    video.addEventListener("loadedmetadata", () => {
      seekBar.value = 0;
    });

    playPauseBtn.addEventListener("click", () => {
      if (video.paused || video.ended) {
        video.play();
      } else {
        video.pause();
      }
    });

    video.addEventListener("play", () => {
      playPauseBtn.classList.add("is-playing");
    });

    video.addEventListener("pause", () => {
      playPauseBtn.classList.remove("is-playing");
    });

    video.addEventListener("ended", () => {
      playPauseBtn.classList.remove("is-playing");
      seekBar.value = 0;
    });

    video.addEventListener("timeupdate", () => {
      if (isSeeking) return;
      const ratio = video.currentTime / video.duration || 0;
      seekBar.value = ratio * 100;
    });

    seekBar.addEventListener("input", () => {
      isSeeking = true;
      const ratio = seekBar.value / 100;
      video.currentTime = ratio * video.duration;
    });

    seekBar.addEventListener("change", () => {
      isSeeking = false;
    });

    volume.addEventListener("input", () => {
      video.volume = parseFloat(volume.value);
    });

    fsBtn.addEventListener("click", async () => {
      if (!document.fullscreenElement) {
        if (videoContainer.requestFullscreen) {
          await videoContainer.requestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          await document.exitFullscreen();
        }
      }
    });
  </script>
</body>
</html>
