<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Video Flippato</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-family: system-ui, sans-serif;
    }

    .player {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .video-frame {
      background: #000;
      max-width: 90vw;
      max-height: 80vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* SOLO l'immagine del video è specchiata */
    .mirror {
      transform: scaleX(-1);
    }

    video {
      max-width: 100%;
      max-height: 80vh;
      display: block;
      background: #000;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      max-width: 90vw;
    }

    button {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid #ddd;
      background: #fff;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #f5f5f5;
    }

    input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 3px;
      border-radius: 999px;
      background: #e2e2e2;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #111;
      margin-top: -4px;
    }

    input[type="range"]::-moz-range-thumb {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #111;
      border: none;
    }

    input[type="range"]::-moz-range-track {
      background: #e2e2e2;
      height: 3px;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <input id="fileInput" type="file" accept="video/*" />

  <div class="player">
    <div class="video-frame">
      <div class="mirror">
        <video id="video"></video>
      </div>
    </div>

    <div class="controls">
      <button id="playPauseBtn" type="button">Play</button>
      <input id="seekBar" type="range" min="0" max="100" value="0" />
    </div>
  </div>

  <script>
    const fileInput = document.getElementById("fileInput");
    const video = document.getElementById("video");
    const playPauseBtn = document.getElementById("playPauseBtn");
    const seekBar = document.getElementById("seekBar");

    let objectUrl = null;
    let isSeeking = false;

    fileInput.addEventListener("change", () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;

      if (objectUrl) URL.revokeObjectURL(objectUrl);
      objectUrl = URL.createObjectURL(file);
      video.src = objectUrl;
      video.load();
      video.play();
    });

    playPauseBtn.addEventListener("click", () => {
      if (video.paused || video.ended) {
        video.play();
      } else {
        video.pause();
      }
    });

    video.addEventListener("play", () => {
      playPauseBtn.textContent = "Pausa";
    });

    video.addEventListener("pause", () => {
      playPauseBtn.textContent = "Play";
    });

    video.addEventListener("timeupdate", () => {
      if (isSeeking || !video.duration) return;
      const ratio = video.currentTime / video.duration;
      seekBar.value = ratio * 100;
    });

    seekBar.addEventListener("input", () => {
      isSeeking = true;
      if (!video.duration) return;
      const ratio = seekBar.value / 100;
      video.currentTime = ratio * video.duration;
    });

    seekBar.addEventListener("change", () => {
      isSeeking = false;
    });
  </script>
</body>
</html>
