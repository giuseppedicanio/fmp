<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Flipped Player</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:40px;
font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial;
background:white;
color:#222;
}

a.home-link{
position:fixed;
bottom:12px;
left:12px;
font-size:11px;
color:#666;
text-decoration:none;
}

/* START SCREEN */

.start-screen{
position:fixed;
top:40px;
left:40px;
right:40px;
bottom:40px;
display:flex;
align-items:center;
justify-content:center;
}

.start-screen.hidden{
display:none;
}

.choose-btn-wrap label{
padding:12px 24px;
background:#ececec;
border-radius:6px;
cursor:pointer;
font-size:14px;
}

.choose-btn-wrap label:hover{
background:#e2e2e2;
}

.choose-btn-wrap input{
display:none;
}

/* VIDEO */

.video-container{
position:fixed;
top:40px;
left:40px;
right:40px;
bottom:40px;
background:#000;
display:flex;
align-items:center;
justify-content:center;
}

.video-container.hidden{
display:none;
}

video{
width:100%;
height:100%;
object-fit:contain;
transform:scaleX(-1);
}

/* CONTROLS */

.controls{

position:absolute;
bottom:0;
left:0;
right:0;

background:rgba(255,255,255,0.95);
border-top:1px solid #e5e5e5;

display:flex;
align-items:center;
gap:10px;

padding:10px 12px;

opacity:0;
pointer-events:none;

transition:opacity .25s;

}

.controls.visible{
opacity:1;
pointer-events:auto;
}

/* BUTTON */

button{

border:none;
background:#f3f3f3;
border-radius:6px;

height:32px;
min-width:32px;

display:flex;
align-items:center;
justify-content:center;

cursor:pointer;

}

button:hover{
background:#e8e8e8;
}

svg{
width:16px;
height:16px;
fill:#555;
}

/* PROGRESS */

.progress-wrap{

flex:1;

height:6px;

background:#ddd;
border-radius:3px;

cursor:pointer;

}

.progress-fill{

height:100%;

background:#9aa4af;

border-radius:3px;

width:0%;

}

/* TIME */

.time{
font-size:12px;
color:#666;
min-width:80px;
text-align:right;
}

/* VOLUME */

#volume{

width:70px;

}

/* MOBILE */

@media (max-width:700px){

body{
margin:10px;
}

.video-container{
top:10px;
left:10px;
right:10px;
bottom:10px;
}

.time{
display:none;
}

#volume{
display:none;
}

}

</style>

</head>

<body>

<a class="home-link" href="https://giuseppedicanio.github.io">
Giuseppe Dicanio
</a>

<div class="start-screen" id="startScreen">

<div class="choose-btn-wrap">
<label for="fileInput">Choose file</label>
<input id="fileInput" type="file" accept="video/*">
</div>

</div>

<div class="video-container hidden" id="videoContainer">

<video id="video" playsinline></video>

<div class="controls" id="controls">

<button id="playBtn">

<svg viewBox="0 0 24 24">
<path d="M8 5v14l11-7z"/>
</svg>

</button>

<div class="progress-wrap" id="progressWrap">
<div class="progress-fill" id="progressFill"></div>
</div>

<div class="time" id="time">0:00 / 0:00</div>

<button id="muteBtn">

<svg viewBox="0 0 24 24">
<path d="M4 9v6h4l5 5V4L8 9H4z"/>
</svg>

</button>

<input id="volume" type="range" min="0" max="1" step="0.05" value="1">

<label>

<input type="file" accept="video/*" id="fileInput2" hidden>

<button onclick="fileInput2.click()">

<svg viewBox="0 0 24 24">
<path d="M12 5v14m-7-7h14"/>
</svg>

</button>

</label>

<button id="fullscreenBtn">

<svg viewBox="0 0 24 24">
<path d="M7 14H5v5h5v-2H7v-3zm0-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zm-3-12v2h3v3h2V5h-5z"/>
</svg>

</button>

</div>

</div>

<script>

const video=document.getElementById("video")
const startScreen=document.getElementById("startScreen")
const container=document.getElementById("videoContainer")

const controls=document.getElementById("controls")

const playBtn=document.getElementById("playBtn")

const progressWrap=document.getElementById("progressWrap")
const progressFill=document.getElementById("progressFill")

const timeEl=document.getElementById("time")

const volume=document.getElementById("volume")
const muteBtn=document.getElementById("muteBtn")

const fullscreenBtn=document.getElementById("fullscreenBtn")

let hideTimer

/* LOAD VIDEO */

function loadFile(file){

if(!file)return

video.src=URL.createObjectURL(file)

startScreen.classList.add("hidden")
container.classList.remove("hidden")

video.play()

showControls()

}

fileInput.onchange=function(){loadFile(this.files[0])}
fileInput2.onchange=function(){loadFile(this.files[0])}

/* PLAY */

function togglePlay(){

if(video.paused){
video.play()
}else{
video.pause()
}

}

playBtn.onclick=togglePlay
video.onclick=togglePlay

/* KEYBOARD */

document.addEventListener("keydown",e=>{

if(e.code==="Space"){
e.preventDefault()
togglePlay()
}

if(e.code==="ArrowRight")video.currentTime+=5
if(e.code==="ArrowLeft")video.currentTime-=5

})

/* TIME */

function formatTime(s){

let m=Math.floor(s/60)
let sec=Math.floor(s%60)

return m+":"+(sec<10?"0":"")+sec

}

function updateUI(){

let p=video.currentTime/(video.duration||1)

progressFill.style.width=(p*100)+"%"

timeEl.textContent=
formatTime(video.currentTime)+" / "+formatTime(video.duration||0)

}

video.ontimeupdate=updateUI
video.onloadedmetadata=updateUI

/* SEEK */

progressWrap.onclick=e=>{

const rect=progressWrap.getBoundingClientRect()

const pos=(e.clientX-rect.left)/rect.width

video.currentTime=pos*video.duration

}

/* VOLUME */

volume.oninput=function(){

video.volume=this.value

}

/* MUTE */

muteBtn.onclick=function(){

if(video.volume>0){

video.dataset.prev=video.volume
video.volume=0
volume.value=0

}else{

video.volume=video.dataset.prev||1
volume.value=video.volume

}

}

/* FULLSCREEN */

fullscreenBtn.onclick=function(){

if(!document.fullscreenElement)
container.requestFullscreen()
else
document.exitFullscreen()

}

/* CONTROLS HIDE */

function showControls(){

controls.classList.add("visible")

clearTimeout(hideTimer)

hideTimer=setTimeout(()=>{

if(!video.paused)
controls.classList.remove("visible")

},2000)

}

container.addEventListener("mousemove",showControls)
container.addEventListener("touchstart",showControls)

video.addEventListener("pause",()=>{

controls.classList.add("visible")

})

video.addEventListener("play",showControls)

</script>

</body>
</html>
