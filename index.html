<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Video Player</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background-color: white;
      color: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
    }

    #player-container {
      margin-top: 20px;
      max-width: 800px;
      width: 100%;
      display: none; /* nascosto finché non scegli il file */
      transition: max-width 0.2s ease;
    }

    #player-container.large {
      max-width: 1200px; /* versione più grande */
    }

    .video-wrapper {
      width: 100%;
      background: #000;
    }

    video {
      width: 100%;
      display: block;
      transform: scaleX(-1); /* video sempre capovolto */
      background: #000;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      color: #000;
      background: white;
      flex-wrap: wrap;
    }

    button {
      padding: 6px 10px;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
    }

    button:hover {
      background: #f0f0f0;
    }

    .time-display {
      min-width: 70px;
      text-align: center;
      font-family: monospace;
    }

    /* Slider come striscia senza pallina visibile */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      background: #ddd;
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 0;
      height: 0;
      background: transparent;
      border: none;
    }

    input[type="range"]::-moz-range-thumb {
      width: 0;
      height: 0;
      background: transparent;
      border: none;
    }

    input[type="range"]::-ms-thumb {
      width: 0;
      height: 0;
      background: transparent;
      border: none;
    }

    /* Traccia per Firefox */
    input[type="range"]::-moz-range-track {
      height: 6px;
      background: #ddd;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <!-- All'inizio solo il selettore file -->
  <input type="file" id="file-input" accept="video/*" />

  <!-- Player che compare dopo aver scelto il file -->
  <div id="player-container">
    <div class="video-wrapper">
      <video id="video" playsinline></video>
    </div>
    <div class="controls">
      <button id="play-pause">Play</button>

      <div class="time-display" id="time-display">0:00</div>

      <input type="range" id="seek-bar" min="0" max="100" value="0" style="flex: 1;" />

      <input type="range" id="volume" min="0" max="1" step="0.01" value="1" style="width: 120px;" />

      <button id="size-toggle">Bigger</button>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('file-input');
    const playerContainer = document.getElementById('player-container');
    const video = document.getElementById('video');
    const playPauseBtn = document.getElementById('play-pause');
    const timeDisplay = document.getElementById('time-display');
    const seekBar = document.getElementById('seek-bar');
    const volumeSlider = document.getElementById('volume');
    const sizeToggleBtn = document.getElementById('size-toggle');

    let videoURL = null;
    let seekingByUser = false;

    // Format seconds to M:SS
    function formatTime(seconds) {
      if (isNaN(seconds)) return '0:00';
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return m + ':' + (s < 10 ? '0' + s : s);
    }

    // Aggiorna sfondo slider (riempimento) in base alla percentuale
    function updateSeekBarBackground(percent) {
      seekBar.style.background = `linear-gradient(to right, #000 0%, #000 ${percent}%, #ddd ${percent}%, #ddd 100%)`;
    }

    function updateVolumeBackground(percent) {
      volumeSlider.style.background = `linear-gradient(to right, #000 0%, #000 ${percent}%, #ddd ${percent}%, #ddd 100%)`;
    }

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (!file) return;

      // Rilascia vecchia URL se c'è
      if (videoURL) {
        URL.revokeObjectURL(videoURL);
      }

      videoURL = URL.createObjectURL(file);
      video.src = videoURL;
      video.load();

      playerContainer.style.display = 'block';
      playPauseBtn.textContent = 'Play';

      // reset barre
      seekBar.value = 0;
      updateSeekBarBackground(0);
      updateVolumeBackground(volumeSlider.value * 100);
    });

    playPauseBtn.addEventListener('click', () => {
      if (!video.src) return;
      if (video.paused) {
        video.play();
      } else {
        video.pause();
      }
    });

    video.addEventListener('play', () => {
      playPauseBtn.textContent = 'Pause';
    });

    video.addEventListener('pause', () => {
      playPauseBtn.textContent = 'Play';
    });

    // Aggiorna tempo e barra mentre il video va
    video.addEventListener('timeupdate', () => {
      if (!seekingByUser) {
        const current = video.currentTime;
        const duration = video.duration || 0;
        timeDisplay.textContent = formatTime(current);
        if (duration > 0) {
          const percent = (current / duration) * 100;
          seekBar.value = percent;
          updateSeekBarBackground(percent);
        }
      }
    });

    // Interazione con seek bar
    seekBar.addEventListener('input', () => {
      seekingByUser = true;
      const duration = video.duration || 0;
      const value = seekBar.value;
      updateSeekBarBackground(value);
      if (duration > 0) {
        video.currentTime = (value / 100) * duration;
      }
    });

    seekBar.addEventListener('change', () => {
      seekingByUser = false;
    });

    // Volume
    volumeSlider.addEventListener('input', () => {
      video.volume = volumeSlider.value;
      updateVolumeBackground(volumeSlider.value * 100);
    });

    // Inizializza sfondo volume
    updateVolumeBackground(volumeSlider.value * 100);

    // Bottone per ingrandire/rimpicciolire il player (non full screen)
    sizeToggleBtn.addEventListener('click', () => {
      playerContainer.classList.toggle('large');
      sizeToggleBtn.textContent = playerContainer.classList.contains('large')
        ? 'Smaller'
        : 'Bigger';
    });
  </script>
</body>
</html>
