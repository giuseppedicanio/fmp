<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlippedMediaPlayer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .video-section {
      flex: 1;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform: scaleX(-1);
      background: #000;
      cursor: pointer;
    }

    .welcome-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      z-index: 100;
    }

    .welcome-content {
      text-align: center;
    }

    .welcome-content h1 {
      font-size: 36px;
      margin-bottom: 15px;
      font-weight: 400;
    }

    .welcome-content p {
      font-size: 14px;
      margin-bottom: 30px;
      opacity: 0.7;
    }

    input[type="file"] {
      padding: 12px 24px;
      background: #333;
      color: white;
      border: 1px solid #555;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    .controls-bar {
      background: #111;
      padding: 12px 15px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-top: 1px solid #333;
      z-index: 50;
    }

    .controls-bar.hidden {
      display: none;
    }

    button {
      padding: 6px 12px;
      background: #333;
      color: white;
      border: 1px solid #555;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
    }

    button:hover {
      background: #444;
    }

    .time-display {
      color: white;
      font-family: monospace;
      font-size: 12px;
      min-width: 80px;
      text-align: center;
      flex-shrink: 0;
    }

    input[type="range"] {
      flex: 1;
      min-width: 100px;
      cursor: pointer;
    }

    .volume-control {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    @media (max-width: 768px) {
      .welcome-content h1 {
        font-size: 28px;
      }

      button {
        padding: 5px 10px;
        font-size: 11px;
      }

      .time-display {
        font-size: 11px;
        min-width: 70px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="video-section">
      <video id="video" playsinline></video>
      <div class="welcome-overlay" id="welcome-overlay">
        <div class="welcome-content">
          <h1>FlippedMediaPlayer</h1>
          <p>an online media player that allows users to watch videos in mirrored mode</p>
          <input type="file" id="file-input" accept="video/*" />
        </div>
      </div>
    </div>

    <div class="controls-bar hidden" id="controls-bar">
      <button id="play-pause">▶</button>
      <div class="time-display" id="time-display">0:00 / 0:00</div>
      <input type="range" id="seek-bar" min="0" max="100" value="0" />
      <div class="volume-control">
        <input type="range" id="volume" min="0" max="1" step="0.01" value="1" style="width: 80px;" />
      </div>
      <button id="fullscreen-btn">⛶</button>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('file-input');
    const video = document.getElementById('video');
    const playPauseBtn = document.getElementById('play-pause');
    const timeDisplay = document.getElementById('time-display');
    const seekBar = document.getElementById('seek-bar');
    const volumeSlider = document.getElementById('volume');
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    const controlsBar = document.getElementById('controls-bar');
    const welcomeOverlay = document.getElementById('welcome-overlay');
    const videoSection = document.querySelector('.video-section');

    let videoURL = null;
    let seekingByUser = false;
    let controlsTimeout = null;

    function formatTime(seconds) {
      if (isNaN(seconds) || !isFinite(seconds)) return '0:00';
      const minutes = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${minutes}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function updateTimeDisplay() {
      const current = video.currentTime || 0;
      const duration = video.duration || 0;
      timeDisplay.textContent = `${formatTime(current)} / ${formatTime(duration)}`;
    }

    function togglePlayPause() {
      if (!video.src) return;
      if (video.paused) {
        video.play();
      } else {
        video.pause();
      }
    }

    function showControls() {
      controlsBar.classList.remove('hidden');
      clearTimeout(controlsTimeout);
      
      controlsTimeout = setTimeout(() => {
        if (!video.paused) {
          controlsBar.classList.add('hidden');
        }
      }, 3000);
    }

    function requestFullscreen() {
      const elem = videoSection;
      if (elem.requestFullscreen) {
        elem.requestFullscreen().catch(() => {});
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      }
    }

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (!file) return;

      if (videoURL) {
        URL.revokeObjectURL(videoURL);
      }

      videoURL = URL.createObjectURL(file);
      video.src = videoURL;
      video.load();

      welcomeOverlay.style.display = 'none';
      controlsBar.classList.remove('hidden');
      playPauseBtn.textContent = '▶';
      seekBar.value = 0;
      volumeSlider.value = 1;
      video.volume = 1;
      video.currentTime = 0;
      updateTimeDisplay();
    });

    video.addEventListener('loadedmetadata', () => {
      updateTimeDisplay();
    });

    video.addEventListener('timeupdate', () => {
      if (!seekingByUser) {
        const percent = (video.currentTime / video.duration) * 100;
        seekBar.value = percent;
        updateTimeDisplay();
      }
    });

    video.addEventListener('play', () => {
      playPauseBtn.textContent = '⏸';
      showControls();
    });

    video.addEventListener('pause', () => {
      playPauseBtn.textContent = '▶';
      controlsBar.classList.remove('hidden');
    });

    video.addEventListener('mousemove', showControls);
    video.addEventListener('click', togglePlayPause);

    playPauseBtn.addEventListener('click', togglePlayPause);

    seekBar.addEventListener('input', () => {
      seekingByUser = true;
      const duration = video.duration || 0;
      if (duration > 0) {
        video.currentTime = (seekBar.value / 100) * duration;
      }
      updateTimeDisplay();
    });

    seekBar.addEventListener('change', () => {
      seekingByUser = false;
    });

    volumeSlider.addEventListener('input', () => {
      video.volume = volumeSlider.value;
    });

    fullscreenBtn.addEventListener('click', requestFullscreen);

    document.addEventListener('keydown', (event) => {
      if (!video.src) return;

      const active = document.activeElement;
      if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) return;

      switch (event.code) {
        case 'Space':
          event.preventDefault();
          togglePlayPause();
          break;
        case 'KeyF':
          event.preventDefault();
          requestFullscreen();
          break;
        case 'ArrowRight':
          event.preventDefault();
          video.currentTime = Math.min(video.currentTime + 5, video.duration);
          showControls();
          updateTimeDisplay();
          break;
        case 'ArrowLeft':
          event.preventDefault();
          video.currentTime = Math.max(video.currentTime - 5, 0);
          showControls();
          updateTimeDisplay();
          break;
      }
    });

    updateTimeDisplay();
  </script>
</body>
</html>
