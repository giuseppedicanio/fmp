<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Flip Media Player</title>
<style>
body{
    font-family: Arial, sans-serif;
    background:#111;
    color:white;
    text-align:center;
    padding:40px;
}

#player-container{
    width:720px;
    margin:auto;
}

video{
    width:100%;
    background:black;
    transform: scaleX(-1);
}

.controls{
    margin-top:10px;
    display:flex;
    align-items:center;
    gap:10px;
}

button{
    padding:6px 12px;
}

#progress{
    flex:1;
}
</style>
</head>
<body>

<h1>Flip Media Player</h1>

<input type="file" id="fileInput" accept="video/*">

<div id="player-container">

<video id="video"></video>

<div class="controls">

<button id="play">Play</button>

<input type="range" id="progress" value="0" min="0" max="100">

<span id="time">0:00</span>

</div>

</div>

<script src="app.js"></script>
</body>
</html>
