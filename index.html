<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Flip Media Player</title>

<style>

body{
    margin:0;
    font-family:sans-serif;
    background:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

#upload{
    font-size:18px;
    padding:10px 20px;
}

#player{
    display:none;
    width:800px;
}

video{
    width:100%;
    background:black;
    transform:scaleX(-1);
}

.controls{
    display:flex;
    gap:10px;
    align-items:center;
    margin-top:8px;
}

#progress{
    flex:1;
}

#volume{
    width:100px;
}

button{
    padding:6px 10px;
}

</style>
</head>

<body>

<input type="file" id="upload" accept="video/*">

<div id="player">

<video id="video"></video>

<div class="controls">

<button id="play">Play</button>

<input type="range" id="progress" value="0" min="0" max="100">

<input type="range" id="volume" min="0" max="1" step="0.01" value="1">

<button id="fullscreen">Fullscreen</button>

</div>

</div>

<script src="app.js"></script>

</body>
</html>
