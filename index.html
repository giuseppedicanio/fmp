<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<title>Flip Media Player</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

#upload{
padding:12px 22px;
font-size:18px;
cursor:pointer;
}

#player{
display:none;
width:800px;
}

video{
width:100%;
background:black;
transform:scaleX(-1);
}

.controls{
display:flex;
align-items:center;
gap:10px;
margin-top:10px;
}

button{
padding:6px 12px;
cursor:pointer;
}

#progress{
flex:1;
}

#volume{
width:100px;
}

#time{
min-width:90px;
text-align:center;
}

</style>

</head>

<body>

<input type="file" id="upload" accept="video/*">

<div id="player">

<video id="video"></video>

<div class="controls">

<button id="play">Play</button>

<input type="range" id="progress" min="0" max="100" value="0">

<span id="time">0:00 / 0:00</span>

<input type="range" id="volume" min="0" max="1" step="0.01" value="1">

<button id="fullscreen">Fullscreen</button>

</div>

</div>

<script src="app.js" defer></script>

</body>
</html>
