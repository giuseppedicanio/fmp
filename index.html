<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minimal Video Player</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: #fff;
    font-family: sans-serif;
    overflow: hidden;
  }

  /* File input */
  #videoFile {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    cursor: pointer;
    padding: 14px 28px;
    font-size: 16px;
    z-index: 10;
  }

  /* Video container fills screen */
  .player-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: none;
    justify-content: center;
    align-items: center;
    background: #fff;
  }

  /* Flipped wrapper */
  .video-wrapper {
    transform: scaleX(-1); /* flip video horizontally */
    display: inline-block;
  }

  /* Video itself normal, controls unaffected */
  video {
    max-width: 100%;
    max-height: 100%;
    display: block;
    object-fit: contain;
  }
</style>
</head>
<body>

<!-- File input centered -->
<input type="file" id="videoFile" accept="video/*" title="Choose Video">

<!-- Video player container -->
<div class="player-container" id="playerContainer">
  <div class="video-wrapper">
    <video id="videoPlayer" controls></video>
  </div>
</div>

<script>
const fileInput = document.getElementById('videoFile');
const playerContainer = document.getElementById('playerContainer');
const videoPlayer = document.getElementById('videoPlayer');

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if(file){
    videoPlayer.src = URL.createObjectURL(file);
    videoPlayer.play();

    // Show video container
    playerContainer.style.display = 'flex';

    // Move file input to top center
    fileInput.style.top = '20px';
    fileInput.style.left = '50%';
    fileInput.style.transform = 'translateX(-50%)';
  }
});
</script>

</body>
</html>
