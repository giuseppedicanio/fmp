<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Flipped Media Player</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background-color: white;
      color: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
    }

    #welcome-message {
      text-align: center;
      font-size: 18px;
      color: #666;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    #player-container {
      margin-top: 20px;
      max-width: 800px;
      width: 100%;
      display: none;
    }

    .video-wrapper {
      width: 100%;
      background: #000;
    }

    video {
      width: 100%;
      display: block;
      transform: scaleX(-1);
      background: #000;
      cursor: pointer;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      color: #000;
      background: white;
      flex-wrap: wrap;
    }

    button {
      padding: 6px 10px;
      border: none;
      outline: none;
      background: #fff;
      cursor: pointer;
    }

    button:hover {
      background: #f0f0f0;
    }

    .time-display {
      min-width: 110px;
      text-align: center;
      font-family: "Consolas", "Courier New", monospace;
      font-size: 14px;
    }

    /* Slider base: striscia senza pallina, SPIGOLI NETTI */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      background: #ddd;
      border-radius: 0;   /* niente arrotondamento */
      outline: none;
      cursor: pointer;
    }

    /* WebKit (Chrome, Edge, Safari, Opera) - traccia */
    input[type="range"]::-webkit-slider-runnable-track {
      height: 6px;
      background: transparent;
      border-radius: 0;   /* niente arrotondamento */
    }

    /* WebKit - pallina invisibile */
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 0;
      height: 0;
      background: transparent;
      border: none;
      margin-top: 0;
    }

    /* Firefox - traccia */
    input[type="range"]::-moz-range-track {
      height: 6px;
      background: transparent;
      border-radius: 0;   /* niente arrotondamento */
    }

    /* Firefox - riempimento */
    input[type="range"]::-moz-range-progress {
      height: 6px;
      background: #000;
      border-radius: 0;   /* niente arrotondamento */
    }

    /* Firefox - pallina invisibile */
    input[type="range"]::-moz-range-thumb {
      width: 0;
      height: 0;
      background: transparent;
      border: none;
    }

    /* IE/Edge legacy - traccia */
    input[type="range"]::-ms-track {
      height: 6px;
      background: transparent;
      border-color: transparent;
      color: transparent;
    }

    input[type="range"]::-ms-fill-lower {
      background: #000;
      border-radius: 0;   /* niente arrotondamento */
    }

    input[type="range"]::-ms-fill-upper {
      background: #ddd;
      border-radius: 0;   /* niente arrotondamento */
    }

    /* IE/Edge - pallina invisibile */
    input[type="range"]::-ms-thumb {
      width: 0;
      height: 0;
      background: transparent;
      border: none;
    }
  </style>
</head>
<body>
  <div id="welcome-message">
    <p>Select a video file to start</p>
  </div>

  <input type="file" id="file-input" accept="video/*" />

  <div id="player-container">
    <div class="video-wrapper">
      <video id="video" playsinline></video>
    </div>
    <div class="controls">
      <button id="play-pause">Play</button>

      <div class="time-display" id="time-display">0:00 / 0:00</div>

      <input type="range" id="seek-bar" min="0" max="100" value="0" style="flex: 1;" />

      <input type="range" id="volume" min="0" max="1" step="0.01" value="1" style="width: 120px;" />
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('file-input');
    const playerContainer = document.getElementById('player-container');
    const welcomeMessage = document.getElementById('welcome-message');
    const video = document.getElementById('video');
    const playPauseBtn = document.getElementById('play-pause');
    const timeDisplay = document.getElementById('time-display');
    const seekBar = document.getElementById('seek-bar');
    const volumeSlider = document.getElementById('volume');

    let videoURL = null;
    let seekingByUser = false;

    function formatTime(seconds) {
      if (isNaN(seconds) || !isFinite(seconds)) return '0:00';
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return m + ':' + (s < 10 ? '0' + s : s);
    }

    function updateSeekBarBackground(percent) {
      seekBar.style.background = `linear-gradient(to right, #000 0%, #000 ${percent}%, #ddd ${percent}%, #ddd 100%)`;
    }

    function updateVolumeBackground(percent) {
      volumeSlider.style.background = `linear-gradient(to right, #000 0%, #000 ${percent}%, #ddd ${percent}%, #ddd 100%)`;
    }

    function updateTimeDisplay() {
      const current = video.currentTime || 0;
      const duration = video.duration || 0;
      timeDisplay.textContent = `${formatTime(current)} / ${formatTime(duration)}`;
    }

    function togglePlayPause() {
      if (!video.src) return;
      if (video.paused) {
        video.play();
      } else {
        video.pause();
      }
    }

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (!file) return;

      if (videoURL) {
        URL.revokeObjectURL(videoURL);
      }

      videoURL = URL.createObjectURL(file);
      video.src = videoURL;
      video.load();

      welcomeMessage.style.display = 'none';
      playerContainer.style.display = 'block';
      playPauseBtn.textContent = 'Play';

      seekBar.value = 0;
      updateSeekBarBackground(0);
      updateVolumeBackground(volumeSlider.value * 100);
      updateTimeDisplay();
    });

    video.addEventListener('loadedmetadata', () => {
      updateTimeDisplay();
    });

    playPauseBtn.addEventListener('click', () => {
      togglePlayPause();
    });

    video.addEventListener('play', () => {
      playPauseBtn.textContent = 'Pause';
    });

    video.addEventListener('pause', () => {
      playPauseBtn.textContent = 'Play';
    });

    video.addEventListener('click', () => {
      togglePlayPause();
    });

    document.addEventListener('keydown', (event) => {
      const active = document.activeElement;
      const isTypingElement =
        active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA');

      if (isTypingElement) return;

      if (event.code === 'Space' || event.key === ' ') {
        event.preventDefault();
        togglePlayPause();
      }
    });

    video.addEventListener('timeupdate', () => {
      if (!seekingByUser) {
        const current = video.currentTime;
        const duration = video.duration || 0;
        const percent = duration > 0 ? (current / duration) * 100 : 0;
        seekBar.value = percent;
        updateSeekBarBackground(percent);
        updateTimeDisplay();
      }
    });

    seekBar.addEventListener('input', () => {
      seekingByUser = true;
      const duration = video.duration || 0;
      const value = seekBar.value;
      updateSeekBarBackground(value);
      if (duration > 0) {
        video.currentTime = (value / 100) * duration;
      }
      updateTimeDisplay();
    });

    seekBar.addEventListener('change', () => {
      seekingByUser = false;
    });

    volumeSlider.addEventListener('input', () => {
      video.volume = volumeSlider.value;
      updateVolumeBackground(volumeSlider.value * 100);
    });

    updateVolumeBackground(volumeSlider.value * 100);
  </script>
</body>
</html>
