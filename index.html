<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Flipped Media Player</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background-color: white;
      color: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
    }

    #player-container {
      margin-top: 20px;
      max-width: 800px;
      width: 100%;
      display: none; /* hidden until file is selected */
    }

    .video-wrapper {
      width: 100%;
      background: #000;
    }

    video {
      width: 100%;
      display: block;
      transform: scaleX(-1); /* flip video horizontally */
      background: #000;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      color: #000;
    }

    button {
      padding: 6px 10px;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
    }

    button:hover {
      background: #f0f0f0;
    }

    input[type="range"] {
      cursor: pointer;
    }

    .time-display {
      min-width: 70px;
      text-align: center;
      font-family: monospace;
    }

    .spacer {
      flex: 1;
    }
  </style>
</head>
<body>
  <h2>Flipped Video Player</h2>

  <!-- Step 1: Only file selector shown at start -->
  <input type="file" id="file-input" accept="video/*" />

  <!-- Step 2: Player appears after file is chosen -->
  <div id="player-container">
    <div class="video-wrapper">
      <video id="video" playsinline></video>
    </div>
    <div class="controls">
      <button id="play-pause">Play</button>

      <div class="time-display" id="time-display">0:00</div>

      <input type="range" id="seek-bar" min="0" max="100" value="0" style="flex: 1;" />

      <input type="range" id="volume" min="0" max="1" step="0.01" value="1" />
      <button id="fullscreen">Full</button>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('file-input');
    const playerContainer = document.getElementById('player-container');
    const video = document.getElementById('video');
    const playPauseBtn = document.getElementById('play-pause');
    const timeDisplay = document.getElementById('time-display');
    const seekBar = document.getElementById('seek-bar');
    const volumeSlider = document.getElementById('volume');
    const fullscreenBtn = document.getElementById('fullscreen');

    let videoURL = null;
    let seekingByUser = false;

    // Format seconds to M:SS
    function formatTime(seconds) {
      if (isNaN(seconds)) return '0:00';
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return m + ':' + (s < 10 ? '0' + s : s);
    }

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (!file) return;

      // Release old URL if any
      if (videoURL) {
        URL.revokeObjectURL(videoURL);
      }

      videoURL = URL.createObjectURL(file);
      video.src = videoURL;
      video.load();

      playerContainer.style.display = 'block';
      playPauseBtn.textContent = 'Play';
    });

    playPauseBtn.addEventListener('click', () => {
      if (!video.src) return;
      if (video.paused) {
        video.play();
      } else {
        video.pause();
      }
    });

    video.addEventListener('play', () => {
      playPauseBtn.textContent = 'Pause';
    });

    video.addEventListener('pause', () => {
      playPauseBtn.textContent = 'Play';
    });

    // Update time and seek bar as video plays
    video.addEventListener('timeupdate', () => {
      if (!seekingByUser) {
        const current = video.currentTime;
        const duration = video.duration || 0;
        timeDisplay.textContent = formatTime(current);
        if (duration > 0) {
          seekBar.value = (current / duration) * 100;
        }
      }
    });

    // Seek bar interaction
    seekBar.addEventListener('input', () => {
      seekingByUser = true;
      const duration = video.duration || 0;
      const value = seekBar.value;
      if (duration > 0) {
        video.currentTime = (value / 100) * duration;
      }
    });

    seekBar.addEventListener('change', () => {
      seekingByUser = false;
    });

    // Volume control
    volumeSlider.addEventListener('input', () => {
      video.volume = volumeSlider.value;
    });

    // Fullscreen
    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        if (video.requestFullscreen) {
          video.requestFullscreen();
        } else if (video.webkitRequestFullscreen) {
          video.webkitRequestFullscreen();
        } else if (video.msRequestFullscreen) {
          video.msRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        } else if (document.msExitFullscreen) {
          document.msExitFullscreen();
        }
      }
    });
  </script>
</body>
</html>
