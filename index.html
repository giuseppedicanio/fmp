<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Flipped Video</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
      transform: scaleX(-1);
    }
    label {
      position: fixed;
      inset: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    label input {
      display: none;
    }
  </style>
</head>
<body>
  <label>
    <input id="f" type="file" accept="video/*" />
  </label>
  <video id="v" controls playsinline></video>

  <script>
    document.getElementById('f').onchange = function () {
      var f = this.files[0];
      if (!f) return;
      document.getElementById('v').src = URL.createObjectURL(f);
      document.querySelector('label').style.pointerEvents = 'none';
    };
  </script>
</body>
</html>
