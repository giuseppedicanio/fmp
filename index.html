<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Flipped Media Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 50px;
      min-height: calc(100vh - 100px);
      width: calc(100vw - 100px);
      background: white;
      color: black;
      font-family: Arial, Helvetica, sans-serif;
      transform: scaleX(-1);
    }
    nav a, a.home-link {
      margin-right: 25px;
      text-decoration: none;
      color: black;
    }
    nav a:hover, a.home-link:hover {
      text-decoration: underline;
    }
    footer {
      margin-top: 100px;
      font-size: 14px;
    }
    a.home-link {
      position: fixed;
      bottom: 1rem;
      left: 1rem;
      z-index: 10;
      font-size: 14px;
    }
    /* Centered choose file when no video */
    .start-screen {
      position: fixed;
      top: 50px;
      left: 50px;
      right: 50px;
      bottom: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }
    .start-screen.hidden {
      display: none;
    }
    .choose-btn-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }
    .choose-btn-wrap label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.5rem;
      background: black;
      color: white;
      font-size: 0.95rem;
      cursor: pointer;
      border-radius: 0;
      transition: background 0.2s ease;
    }
    .choose-btn-wrap label:hover {
      background: #333;
    }
    .choose-btn-wrap input[type="file"] {
      display: none;
    }

    /* Video container */
    .video-container {
      position: fixed;
      top: 50px;
      left: 50px;
      right: 50px;
      bottom: 50px;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: black;
    }
    .video-container.hidden {
      display: none;
    }
    .video-container video {
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
    }

    /* Custom controls bar */
    .controls {
      position: fixed;
      bottom: 50px;
      left: 50px;
      right: 50px;
      z-index: 5;
      height: 56px;
      background: linear-gradient(transparent, rgba(0,0,0,0.85));
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .video-container:hover .controls,
    .controls:hover,
    .controls.paused {
      opacity: 1;
    }
    .controls-btn {
      width: 40px;
      height: 40px;
      border: none;
      background: rgba(255,255,255,0.15);
      color: #fff;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease, transform 0.15s ease;
    }
    .controls-btn:hover {
      background: rgba(255,255,255,0.3);
      transform: scale(1.05);
    }
    .controls-btn svg {
      width: 20px;
      height: 20px;
    }
    .progress-wrap {
      flex: 1;
      height: 6px;
      background: rgba(255,255,255,0.25);
      border-radius: 3px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .progress-wrap:hover {
      height: 8px;
      background: rgba(255,255,255,0.35);
    }
    .progress-fill {
      height: 100%;
      background: #fff;
      border-radius: 3px;
      width: 0%;
      transition: width 0.1s linear;
    }
    .time {
      color: rgba(255,255,255,0.9);
      font-size: 0.8rem;
      min-width: 100px;
      text-align: right;
    }
    .vol-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .vol-wrap input[type="range"] {
      width: 72px;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255,255,255,0.25);
      border-radius: 2px;
      outline: none;
    }
    .vol-wrap input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .vol-wrap input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }
    .change-file {
      font-size: 0.8rem;
      padding: 0.4rem 0.75rem;
      border-radius: 999px;
      background: rgba(255,255,255,0.2);
      color: #fff;
      cursor: pointer;
      border: none;
      letter-spacing: 0.02em;
      transition: background 0.2s ease;
    }
    .change-file:hover {
      background: rgba(255,255,255,0.35);
    }
    .change-file input {
      display: none;
    }
  </style>
</head>
<body>
  <a class="home-link" href="https://giuseppedicanio.github.io">Giuseppe Dicanio</a>

  <div class="start-screen" id="startScreen">
    <div class="choose-btn-wrap">
      <label for="f">Choose file</label>
      <input id="f" type="file" accept="video/*" />
    </div>
  </div>

  <div class="video-container hidden" id="videoContainer">
    <video id="v" playsinline></video>
    <div class="controls" id="controls">
      <button type="button" class="controls-btn" id="playBtn" aria-label="Play">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="pauseIcon" style="display:none" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <div class="progress-wrap" id="progressWrap">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <span class="time" id="time">0:00 / 0:00</span>
      <div class="vol-wrap">
        <button type="button" class="controls-btn" id="muteBtn" aria-label="Mute">
          <svg id="volIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        </button>
        <input type="range" id="volume" min="0" max="1" step="0.05" value="1" />
      </div>
      <label class="change-file">
        Choose file
        <input type="file" accept="video/*" id="f2" />
      </label>
      <button type="button" class="controls-btn" id="fullscreenBtn" aria-label="Fullscreen">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
      </button>
    </div>
  </div>

  <script>
    /* ===== CSS dinamico (stesso mood del sito principale) ===== */
    var css = `
      body {
        margin: 50px;
        font-family: Arial, Helvetica, sans-serif;
        background: white;
        color: black;
      }
      nav a, a.home-link {
        margin-right: 25px;
        text-decoration: none;
        color: black;
      }
      nav a:hover, a.home-link:hover {
        text-decoration: underline;
      }
      footer {
        margin-top: 100px;
        font-size: 14px;
      }
    `;
    var styleEl = document.createElement('style');
    styleEl.textContent = css;
    document.head.appendChild(styleEl);

    var v = document.getElementById('v');
    var startScreen = document.getElementById('startScreen');
    var videoContainer = document.getElementById('videoContainer');
    var controls = document.getElementById('controls');
    var playBtn = document.getElementById('playBtn');
    var progressWrap = document.getElementById('progressWrap');
    var progressFill = document.getElementById('progressFill');
    var timeEl = document.getElementById('time');
    var volumeEl = document.getElementById('volume');
    var muteBtn = document.getElementById('muteBtn');
    var volIcon = document.getElementById('volIcon');
    var fullscreenBtn = document.getElementById('fullscreenBtn');

    function loadFile(file) {
      if (!file) return;
      v.src = URL.createObjectURL(file);
      startScreen.classList.add('hidden');
      videoContainer.classList.remove('hidden');
      v.play();
    }

    document.getElementById('f').addEventListener('change', function () { loadFile(this.files[0]); });
    document.getElementById('f2').addEventListener('change', function () { loadFile(this.files[0]); });

    function formatTime(s) {
      var m = Math.floor(s / 60);
      var sec = Math.floor(s % 60);
      return m + ':' + (sec < 10 ? '0' : '') + sec;
    }

    function updateUI() {
      var p = v.currentTime / (v.duration || 1);
      progressFill.style.width = (p * 100) + '%';
      timeEl.textContent = formatTime(v.currentTime) + ' / ' + formatTime(v.duration || 0);
    }

    v.addEventListener('timeupdate', updateUI);
    v.addEventListener('loadedmetadata', updateUI);

    playBtn.addEventListener('click', function () {
      if (v.paused) { v.play(); controls.classList.remove('paused'); }
      else { v.pause(); controls.classList.add('paused'); }
    });
    v.addEventListener('play', function () {
      controls.classList.remove('paused');
      document.getElementById('playIcon').style.display = 'none';
      document.getElementById('pauseIcon').style.display = 'block';
    });
    v.addEventListener('pause', function () {
      controls.classList.add('paused');
      document.getElementById('playIcon').style.display = 'block';
      document.getElementById('pauseIcon').style.display = 'none';
    });

    progressWrap.addEventListener('click', function (e) {
      if (!v.duration) return;
      var x = e.clientX - progressWrap.getBoundingClientRect().left;
      v.currentTime = (x / progressWrap.offsetWidth) * v.duration;
    });

    volumeEl.addEventListener('input', function () {
      v.volume = this.value;
      volIcon.innerHTML = this.value > 0
        ? '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>'
        : '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
    });

    fullscreenBtn.addEventListener('click', function () {
      if (!document.fullscreenElement) {
        videoContainer.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    });
  </script>
</body>
</html>
