<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minimal Video Player</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #fff;
    font-family: sans-serif;
    flex-direction: column;
  }

  /* File input styling */
  #videoFile {
    cursor: pointer;
    padding: 12px 24px;
    font-size: 16px;
  }

  /* Video container */
  .player-container {
    display: none; /* hidden until video is selected */
    flex-direction: column;
    align-items: center;
  }

  video {
    max-width: 90vw;
    max-height: 85vh;
    background: #000;
    transform: scaleX(-1); /* flip video horizontally */
    display: block;
  }
</style>
</head>
<body>

<!-- Centered file input -->
<input type="file" id="videoFile" accept="video/*" title="Choose Video">

<!-- Video player container -->
<div class="player-container" id="playerContainer">
  <video id="videoPlayer" controls></video>
</div>

<script>
const fileInput = document.getElementById('videoFile');
const playerContainer = document.getElementById('playerContainer');
const videoPlayer = document.getElementById('videoPlayer');

// Load video on file selection
fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (file) {
    videoPlayer.src = URL.createObjectURL(file);
    videoPlayer.play();

    // Show the video container
    playerContainer.style.display = 'flex';

    // Optionally move the file input to top center
    fileInput.style.position = 'absolute';
    fileInput.style.top = '20px';
    fileInput.style.left = '50%';
    fileInput.style.transform = 'translateX(-50%)';
  }
});
</script>

</body>
</html>
