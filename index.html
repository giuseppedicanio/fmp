<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Flipped Video Player</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      background: #0f172a;
      color: #e5e7eb;
      padding: 20px;
      box-sizing: border-box;
    }

    h1 {
      margin-bottom: 0.5rem;
      text-align: center;
    }

    p {
      margin-top: 0;
      margin-bottom: 1.5rem;
      text-align: center;
      color: #9ca3af;
    }

    .controls {
      margin-bottom: 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      justify-content: center;
    }

    input[type="file"] {
      color: #e5e7eb;
    }

    label {
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.25rem;
      cursor: pointer;
      user-select: none;
    }

    video {
      max-width: 100%;
      max-height: 70vh;
      background: #020617;
      border-radius: 0.75rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      transform: scaleX(-1); /* default: flipped horizontally */
    }

    .flip-options {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      justify-content: center;
      font-size: 0.9rem;
    }

    .flip-options select {
      padding: 0.2rem 0.4rem;
      border-radius: 0.375rem;
      border: 1px solid #4b5563;
      background: #020617;
      color: #e5e7eb;
    }
  </style>
</head>
<body>
  <h1>Flipped Video Player</h1>
  <p>Choose a video file. It will play flipped (mirrored) directly in your browser.</p>

  <div class="controls">
    <input type="file" id="videoInput" accept="video/*" />

    <div class="flip-options">
      <span>Flip mode:</span>
      <select id="flipMode">
        <option value="horizontal" selected>Horizontal (mirror)</option>
        <option value="vertical">Vertical (upside-down)</option>
        <option value="both">Both (mirror & upside-down)</option>
        <option value="none">None (normal)</option>
      </select>
    </div>
  </div>

  <video id="player" controls></video>

  <script>
    const input = document.getElementById('videoInput');
    const player = document.getElementById('player');
    const flipMode = document.getElementById('flipMode');

    let currentObjectUrl = null;

    input.addEventListener('change', () => {
      const file = input.files && input.files[0];
      if (!file) return;

      // Clean up previous object URL
      if (currentObjectUrl) {
        URL.revokeObjectURL(currentObjectUrl);
        currentObjectUrl = null;
      }

      currentObjectUrl = URL.createObjectURL(file);
      player.src = currentObjectUrl;
      player.play().catch(() => {
        // Autoplay might be blocked; user can press play manually.
      });
    });

    function updateFlip() {
      let transform = '';
      switch (flipMode.value) {
        case 'horizontal':
          transform = 'scaleX(-1)';
          break;
        case 'vertical':
          transform = 'scaleY(-1)';
          break;
        case 'both':
          transform = 'scaleX(-1) scaleY(-1)';
          break;
        case 'none':
        default:
          transform = 'none';
      }
      player.style.transform = transform;
    }

    flipMode.addEventListener('change', updateFlip);

    // Initialize default flip
    updateFlip();
  </script>
</body>
</html>
