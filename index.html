<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title></title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --accent: #111;
      --border: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "Segoe UI", sans-serif;
      background: #ffffff;
      color: #000000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .shell {
      width: 100%;
      max-width: 880px;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      background: #ffffff;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.06);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .top-row {
      display: flex;
      justify-content: flex-start;
      align-items: center;
    }

    .upload-btn {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #fafafa;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, border-color 0.15s ease,
        transform 0.08s ease;
      position: relative;
    }

    .upload-btn:hover {
      background: #f0f0f0;
      border-color: #d0d0d0;
    }

    .upload-btn:active {
      transform: translateY(1px);
    }

    .upload-btn::before,
    .upload-btn::after {
      content: "";
      position: absolute;
      background: var(--accent);
      border-radius: 999px;
    }

    .upload-btn::before {
      width: 12px;
      height: 2px;
    }

    .upload-btn::after {
      width: 2px;
      height: 12px;
    }

    #fileInput {
      display: none;
    }

    .player-shell {
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #fdfdfd;
      padding: 10px 10px 12px;
      display: none;
      flex-direction: column;
      gap: 8px;
    }

    .video-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .video-frame {
      position: relative;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: 100%;
      margin: 0 auto;
    }

    /* quando il container è in fullscreen, rimpicciolisco e centro il player */
    .is-fullscreen .video-frame {
      max-width: 80vw;
      max-height: 80vh;
    }

    .video-mirror-wrapper {
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
      transform-origin: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 4px;
      user-select: none;
    }

    .controls-left,
    .controls-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .controls-main {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* pulsante play/pause circolare con icone standard */
    .ctrl-circle {
      width: 26px;
      height: 26px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, border-color 0.15s ease,
        transform 0.08s ease;
      position: relative;
    }

    .ctrl-circle:hover {
      background: #f4f4f4;
      border-color: #d0d0d0;
    }

    .ctrl-circle:active {
      transform: translateY(1px);
    }

    /* play (triangolo) */
    #playPauseBtn::before {
      content: "";
      border-style: solid;
      border-width: 6px 0 6px 10px;
      border-color: transparent transparent transparent var(--accent);
      margin-left: 2px;
    }

    /* pausa (due stanghette) */
    #playPauseBtn.is-playing::before,
    #playPauseBtn.is-playing::after {
      content: "";
      width: 3px;
      height: 12px;
      background: var(--accent);
      border-radius: 999px;
    }

    #playPauseBtn.is-playing::before {
      margin-right: 2px;
    }

    #playPauseBtn.is-playing::after {
      margin-left: 2px;
    }

    /* barra di avanzamento super semplice: linea + pallino piccolo */
    #seekBar {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 2px;
      border-radius: 999px;
      background: #e2e2e2;
      outline: none;
      cursor: pointer;
    }

    #seekBar::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #111;
      cursor: pointer;
      margin-top: -3px; /* centra il pallino sulla linea */
    }

    #seekBar::-moz-range-thumb {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #111;
      cursor: pointer;
      border: none;
    }

    #seekBar::-moz-range-track {
      background: #e2e2e2;
      height: 2px;
      border-radius: 999px;
    }

    /* volume slider un po' più piccolo, stesso stile */
    #volume {
      -webkit-appearance: none;
      appearance: none;
      width: 70px;
      height: 2px;
      border-radius: 999px;
      background: #e2e2e2;
      outline: none;
      cursor: pointer;
    }

    #volume::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #111;
      cursor: pointer;
      margin-top: -3px;
    }

    #volume::-moz-range-thumb {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #111;
      cursor: pointer;
      border: none;
    }

    #volume::-moz-range-track {
      background: #e2e2e2;
      height: 2px;
      border-radius: 999px;
    }

    /* bottone icona (volume, fullscreen) */
    .icon-btn {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #ffffff;
      cursor: pointer;
      position: relative;
      transition: background 0.15s ease, border-color 0.15s ease,
        transform 0.08s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:hover {
      background: #f4f4f4;
      border-color: #d0d0d0;
    }

    .icon-btn:active {
      transform: translateY(1px);
    }

    /* icona volume stile “casse + onde” */
    .volume-icon::before,
    .volume-icon::after {
      content: "";
      position: absolute;
    }

    .volume-icon::before {
      /* cassa: rettangolo + triangolino */
      width: 8px;
      height: 8px;
      background: var(--accent);
      clip-path: polygon(0 20%, 60% 20%, 100% 0, 100% 100%, 60% 80%, 0 80%);
    }

    .volume-icon::after {
      /* onda singola */
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      border-left-color: transparent;
      border-bottom-color: transparent;
      transform: translateX(6px) rotate(45deg);
    }

    .volume-icon.is-muted::after {
      opacity: 0;
    }

    .volume-icon.is-muted::before {
      clip-path: polygon(0 20%, 60% 20%, 100% 0, 100% 100%, 60% 80%, 0 80%, 0 50%, 100% 50%, 100% 60%, 0 60%);
    }

    /* icona fullscreen stile quattro angoli */
    .fullscreen-icon::before,
    .fullscreen-icon::after {
      content: "";
      position: absolute;
      width: 70%;
      height: 70%;
      border: 1px solid var(--accent);
      border-top: none;
      border-left: none;
      transform: translate(15%, 15%);
      box-sizing: border-box;
    }

    .fullscreen-icon::after {
      transform: translate(-15%, -15%) rotate(180deg);
    }

    @media (max-width: 600px) {
      .shell {
        padding: 18px;
      }
      .controls {
        flex-direction: column;
        align-items: stretch;
      }
      .controls-main {
        width: 100%;
      }
      .controls-left,
      .controls-right {
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="top-row">
      <button id="uploadBtn" type="button" class="upload-btn"></button>
      <input id="fileInput" type="file" accept="video/*" />
    </div>

    <section id="playerShell" class="player-shell">
      <div class="video-container" id="videoContainer">
        <div class="video-frame">
          <div class="video-mirror-wrapper">
            <video id="video" preload="metadata"></video>
          </div>
        </div>

        <div class="controls">
          <div class="controls-left">
            <button id="playPauseBtn" type="button" class="ctrl-circle"></button>
          </div>

          <div class="controls-main">
            <input id="seekBar" type="range" min="0" max="100" value="0" />
          </div>

          <div class="controls-right">
            <button id="volIcon" type="button" class="icon-btn volume-icon"></button>
            <input
              id="volume"
              type="range"
              min="0"
              max="1"
              step="0.01"
              value="1"
            />
            <button id="fsBtn" type="button" class="icon-btn fullscreen-icon"></button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const fileInput = document.getElementById("fileInput");
    const uploadBtn = document.getElementById("uploadBtn");
    const playerShell = document.getElementById("playerShell");
    const video = document.getElementById("video");
    const playPauseBtn = document.getElementById("playPauseBtn");
    const seekBar = document.getElementById("seekBar");
    const volume = document.getElementById("volume");
    const volIcon = document.getElementById("volIcon");
    const fsBtn = document.getElementById("fsBtn");
    const videoContainer = document.getElementById("videoContainer");

    let objectUrl = null;
    let isSeeking = false;
    let lastVolumeBeforeMute = 1;

    uploadBtn.addEventListener("click", () => {
      fileInput.click();
    });

    fileInput.addEventListener("change", () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;

      if (objectUrl) {
        URL.revokeObjectURL(objectUrl);
      }
      objectUrl = URL.createObjectURL(file);
      video.src = objectUrl;
      video.currentTime = 0;
      seekBar.value = 0;
      playerShell.style.display = "flex";
      video.load();
    });

    video.addEventListener("loadedmetadata", () => {
      seekBar.value = 0;
    });

    playPauseBtn.addEventListener("click", () => {
      if (video.paused || video.ended) {
        video.play();
      } else {
        video.pause();
      }
    });

    video.addEventListener("play", () => {
      playPauseBtn.classList.add("is-playing");
    });

    video.addEventListener("pause", () => {
      playPauseBtn.classList.remove("is-playing");
    });

    video.addEventListener("ended", () => {
      playPauseBtn.classList.remove("is-playing");
      seekBar.value = 0;
    });

    video.addEventListener("timeupdate", () => {
      if (isSeeking) return;
      const ratio = video.currentTime / video.duration || 0;
      seekBar.value = ratio * 100;
    });

    seekBar.addEventListener("input", () => {
      isSeeking = true;
      const ratio = seekBar.value / 100;
      video.currentTime = ratio * video.duration;
    });

    seekBar.addEventListener("change", () => {
      isSeeking = false;
    });

    // volume + icona mute
    volume.addEventListener("input", () => {
      const v = parseFloat(volume.value);
      video.volume = v;
      if (v === 0) {
        volIcon.classList.add("is-muted");
      } else {
        volIcon.classList.remove("is-muted");
        lastVolumeBeforeMute = v;
      }
    });

    volIcon.addEventListener("click", () => {
      if (video.volume === 0) {
        const v = lastVolumeBeforeMute || 1;
        video.volume = v;
        volume.value = v;
        volIcon.classList.remove("is-muted");
      } else {
        lastVolumeBeforeMute = video.volume || parseFloat(volume.value) || 1;
        video.volume = 0;
        volume.value = 0;
        volIcon.classList.add("is-muted");
      }
    });

    // fullscreen con player più piccolo e centrato
    fsBtn.addEventListener("click", async () => {
      if (!document.fullscreenElement) {
        if (videoContainer.requestFullscreen) {
          await videoContainer.requestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          await document.exitFullscreen();
        }
      }
    });

    document.addEventListener("fullscreenchange", () => {
      if (document.fullscreenElement === videoContainer) {
        videoContainer.classList.add("is-fullscreen");
      } else {
        videoContainer.classList.remove("is-fullscreen");
      }
    });
  </script>
</body>
</html>
