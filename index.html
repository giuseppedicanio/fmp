<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flip Media Player</title>
<style>
  body {
    background-color: white;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
  }

  h1 {
    color: #333;
  }

  #videoWrapper {
    position: relative;
    max-width: 90%;
    max-height: 60vh;
    margin-top: 20px;
  }

  canvas {
    display: block;
    width: 100%;
    height: auto;
  }

  video {
    display: block;
    width: 100%;
    height: auto;
    /* Manteniamo i controlli visibili */
  }

  input[type="file"] {
    margin-top: 20px;
  }
</style>
</head>
<body>
<h1>Carica un video</h1>
<input type="file" id="videoUpload" accept="video/*">

<div id="videoWrapper">
  <video id="videoPlayer" controls></video>
  <canvas id="mirrorCanvas"></canvas>
</div>

<script>
const videoUpload = document.getElementById('videoUpload');
const videoPlayer = document.getElementById('videoPlayer');
const canvas = document.getElementById('mirrorCanvas');
const ctx = canvas.getContext('2d');

videoUpload.addEventListener('change', function() {
  const file = this.files[0];
  if (file) {
    const videoURL = URL.createObjectURL(file);
    videoPlayer.src = videoURL;
    videoPlayer.play();
  }
});

// Aggiorna il canvas in tempo reale specchiando il video
videoPlayer.addEventListener('play', function() {
  canvas.width = videoPlayer.videoWidth;
  canvas.height = videoPlayer.videoHeight;

  function draw() {
    if (!videoPlayer.paused && !videoPlayer.ended) {
      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1); // specchia orizzontalmente
      ctx.drawImage(videoPlayer, 0, 0, canvas.width, canvas.height);
      ctx.restore();
      requestAnimationFrame(draw);
    }
  }
  draw();
});
</script>
</body>
</html>
