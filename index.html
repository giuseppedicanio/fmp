<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Video Flippato</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
    }

    .page {
      width: 100%;
      max-width: 900px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    #fileInput {
      align-self: flex-start;
    }

    .player {
      width: 100%;
      display: none; /* appare solo dopo che scegli il video */
      flex-direction: column;
      gap: 8px;
    }

    .video-frame {
      width: 100%;
      background: #000;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* SOLO il video viene specchiato */
    .video-mirror {
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    button {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid #ddd;
      background: #fff;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #f5f5f5;
    }

    input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 3px;
      border-radius: 999px;
      background: #e2e2e2;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #111;
      margin-top: -4px;
    }

    input[type="range"]::-moz-range-thumb {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #111;
      border: none;
    }

    input[type="range"]::-moz-range-track {
      background: #e2e2e2;
      height: 3px;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <div class="page">
    <input id="fileInput" type="file" accept="video/*" />

    <div class="player" id="player">
      <div class="video-frame">
        <div class="video-mirror">
          <video id="video" playsinline></video>
        </div>
      </div>

      <div class="controls">
        <button id="playPauseBtn" type="button">Play</button>
        <input id="seekBar" type="range" min="0" max="100" value="0" />
        <button id="fsBtn" type="button">Full</button>
      </div>
    </div>
  </div>

  <script src="player.js"></script>
</body>
</html>
